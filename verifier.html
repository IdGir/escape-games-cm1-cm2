<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification des escape games — médias et énigmes</title>
<!--
  PAGE DE VÉRIFICATION (enseignant)
  - lance chaque salle / escale / séance directement, en mode vérification
    (rien n'est sauvegardé, la progression des élèves reste intacte) ;
  - liste TOUS les emplacements médias des trois jeux, avec aperçu,
    fichier trouvé, poids, et lien pour déposer le fichier sur GitHub ;
  - signale les fichiers mal nommés.
  Les listes sont lues dans les données des jeux eux-mêmes (dialogues.json,
  lecons.json, mission-geo/js/donnees/) : rien à tenir à jour ici, sauf si
  un jeu gagne un nouveau TYPE d'emplacement.
-->
<style>
  :root{
    --fond:#f6f4ef; --papier:#fff; --encre:#1f2430; --doux:#5d6472; --ligne:#e2ddd2; --gris:#f0eee9;
    --bleu:#2f55c8; --bleu-clair:#e6edff; --vert:#15803d; --vert-clair:#e5f5ea;
    --ambre:#b45309; --ambre-clair:#fdf1de; --rouge:#b91c1c; --rouge-clair:#fdecec;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--encre)}
  .haut{background:#1f2430;color:#fff;padding:16px 24px 0}
  .haut .ligne{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto}
  .haut h1{margin:0;font-size:1.3rem}
  .haut .outils{display:flex;gap:8px}
  .haut .outils a,.haut .outils button{background:#353b49;color:#fff;border:0;border-radius:9px;padding:7px 12px;font:inherit;font-size:.88rem;text-decoration:none;cursor:pointer}
  .haut .outils button:hover,.haut .outils a:hover{background:#454c5d}
  .source{max-width:1200px;margin:8px auto 0;font-size:.87rem;color:#cfd3dc}
  nav{display:flex;gap:4px;max-width:1200px;margin:12px auto 0;overflow-x:auto}
  nav button{background:transparent;color:#cfd3dc;border:0;padding:10px 16px;border-radius:10px 10px 0 0;font:inherit;cursor:pointer;white-space:nowrap}
  nav button:hover{color:#fff}
  nav button[aria-selected="true"]{background:var(--fond);color:var(--encre);font-weight:600}
  nav small{opacity:.7;font-weight:400}
  main{max-width:1200px;margin:0 auto;padding:20px 24px 60px}
  .bloc{background:var(--papier);border:1px solid var(--ligne);border-radius:12px;padding:18px 20px;margin-bottom:18px}
  .bloc h2{margin:0 0 4px;font-size:1.08rem}
  .aide{color:var(--doux);font-size:.9rem;margin:0 0 12px}
  .rangee{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .rangee > b{min-width:3.6em;font-size:.9rem}
  .bouton{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:9px;border:1px solid var(--ligne);background:var(--gris);color:var(--encre);text-decoration:none;font:inherit;font-size:.86rem;cursor:pointer}
  .bouton:hover{background:#e7e3da;border-color:#c9c2b3}
  .resume{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
  .pastille{padding:3px 10px;border-radius:999px;font-size:.82rem;background:var(--gris);color:var(--doux)}
  .pastille.video{background:var(--bleu-clair);color:#1e3a8a}
  .pastille.image{background:var(--vert-clair);color:#14532d}
  .pastille.alerte{background:var(--ambre-clair);color:#7c2d12}
  .filtres{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px}
  .filtres button{border:1px solid var(--ligne);background:var(--papier);border-radius:8px;padding:4px 10px;font:inherit;font-size:.84rem;cursor:pointer}
  .filtres button[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:#fff}
  h3.famille{margin:22px 0 10px;color:var(--doux);text-transform:uppercase;letter-spacing:.05em;font-size:.8rem}
  .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .media{background:var(--papier);border:1px solid var(--ligne);border-top-width:4px;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .media.etat-video{border-top-color:var(--bleu)}
  .media.etat-image{border-top-color:var(--vert)}
  .media.etat-absent{border-top-color:#cfc9bd}
  .apercu{aspect-ratio:16/9;background:#22262f;display:flex;align-items:center;justify-content:center;position:relative}
  .apercu a{display:block;width:100%;height:100%}
  .apercu img,.apercu video{width:100%;height:100%;object-fit:contain;display:block}
  .apercu .vide{color:#aeb3bf;text-align:center;font-size:.85rem;padding:10px}
  .apercu .vide span{display:block;font-size:1.8rem}
  .apercu.attente::after{content:"⏳ Publication en cours sur le site — réessayez dans une minute";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:rgba(20,22,28,.85);color:#fff;font-size:.88rem}
  .corps{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .entete{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .media h4{margin:0;font-size:.97rem}
  .etat{flex:none;font-size:.76rem;padding:2px 8px;border-radius:999px;background:var(--gris);color:var(--doux);white-space:nowrap}
  .etat-video .etat{background:var(--bleu-clair);color:#1e3a8a}
  .etat-image .etat{background:var(--vert-clair);color:#14532d}
  .role{margin:0;color:var(--doux);font-size:.84rem}
  .media ul{list-style:none;margin:2px 0;padding:0;font-size:.83rem;display:grid;gap:3px}
  .media li.ok{color:var(--vert)}
  .media li.manque{color:var(--doux)}
  code{background:var(--gris);padding:1px 5px;border-radius:5px;font-size:.8rem;color:var(--encre);word-break:break-all}
  .lourd{color:var(--ambre);font-weight:600}
  .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
  .actions .bouton{font-size:.79rem;padding:4px 9px}
  .message{padding:12px 14px;border-radius:10px;background:var(--ambre-clair);color:#7c2d12;margin-bottom:16px}
  .message.erreur{background:var(--rouge-clair);color:var(--rouge)}
  .message a{color:inherit}
  .orphelins{margin:0;padding-left:18px;font-size:.9rem}
  .orphelins li{margin:4px 0}
  .liste-docs{display:flex;flex-wrap:wrap;gap:8px}
  [hidden]{display:none!important}
  @media (max-width:600px){ main{padding:14px} .haut{padding:14px 14px 0} .grille{grid-template-columns:1fr} }
</style>
</head>
<body>

<header class="haut">
  <div class="ligne">
    <h1>🔍 Vérification des escape games</h1>
    <div class="outils">
      <button type="button" id="btn-actualiser" title="Relire les dossiers (après avoir déposé un fichier)">🔄 Actualiser</button>
      <a href="./">🏠 Accueil</a>
    </div>
  </div>
  <div class="source" id="source">Recherche des fichiers…</div>
  <nav role="tablist" id="onglets"></nav>
</header>

<main id="contenu"></main>

<!-- Données de Mission géographique (pur contenu, aucune logique de jeu) -->
<script src="mission-geo/js/donnees/lecons.js"></script>
<script src="mission-geo/js/donnees/sessions-p1.js"></script>
<script src="mission-geo/js/donnees/sessions-p2.js"></script>
<script src="mission-geo/js/donnees/sessions-p3.js"></script>
<script src="mission-geo/js/donnees/sessions-p4.js"></script>
<script src="mission-geo/js/donnees/sessions-p5.js"></script>
<script src="mission-geo/js/donnees/final.js"></script>

<script>
"use strict";

const DEPOT = { owner: "IdGir", repo: "escape-games-cm1-cm2", branche: "escape-games" };
const EN_LIGNE = location.hostname.endsWith("github.io");
const EN_FICHIER = location.protocol === "file:";

/* Extensions acceptées, dans l'ordre où chaque jeu les cherche */
const EXT = {
  video:   [".mp4", ".webm"],
  image:   [".jpg", ".png", ".webp", ".jpeg"],
  perso:   [".png", ".gif", ".webp", ".jpg", ".jpeg"],
  jpg:     [".jpg"],
  mp4:     [".mp4"],
  mgVideo: [".mp4", ".webm", ".m4v"],
  mgImage: [".jpg", ".jpeg", ".png", ".webp", ".gif", ".svg"]
};
/* Au-delà, le fichier est signalé comme lourd (chargement lent en classe) */
const SEUIL = { video: 20e6, image: 3e6 };

const ONGLETS = [
  { id: "declaration",   titre: "🏛️ Le Secret de la Déclaration" },
  { id: "tour-du-monde", titre: "🧭 Le Tour du Monde" },
  { id: "mission-geo",   titre: "🗺️ Mission géographique" },
  { id: "constitution",  titre: "⚖️ Le Sceau de la République" }
];

let JETON = Date.now();   // anti-cache des aperçus, renouvelé à chaque actualisation
let INVENTAIRE = { source: "…", fichiers: null };
const JEUX = {};
let actif = ONGLETS.some(o => "#" + o.id === location.hash) ? location.hash.slice(1) : "declaration";
let filtre = "tous";

/* ---------------- Outils ---------------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const enc = chemin => encodeURI(chemin);
const mo = o => o >= 1e6 ? (o / 1e6).toFixed(1).replace(".", ",") + " Mo"
                         : Math.max(1, Math.round(o / 1e3)) + " Ko";
const lienUpload = dossier =>
  `https://github.com/${DEPOT.owner}/${DEPOT.repo}/upload/${DEPOT.branche}/${dossier.replace(/\/$/, "")}`;
const lienGitHub = chemin =>
  `https://github.com/${DEPOT.owner}/${DEPOT.repo}/blob/${DEPOT.branche}/${chemin}`;
const listeLecons = l => Array.isArray(l.lecons) ? l.lecons : Object.values(l.lecons || {});

async function json(chemin){
  const r = await fetch(chemin, { cache: "no-store" });
  if(!r.ok) throw new Error(chemin + " (" + r.status + ")");
  return r.json();
}

/* ---------------- Emplacements types ---------------- */
function decor(R, base, titre, role, tester){
  return { titre, role, tester, groupes: [
    { type: "video", libelle: "Vidéo", dossier: R + "assets/videos/", base, ext: EXT.video },
    { type: "image", libelle: "Image (affiche ; décor fixe si pas de vidéo)", dossier: R + "assets/images/decors/", base, ext: EXT.image }
  ]};
}
function personnage(R, base, nom, tester){
  return { titre: nom, tester,
    role: "Remplace le personnage dessiné. Vidéo en boucle muette (portrait vertical) ou image carrée.",
    groupes: [
      { type: "video", libelle: "Vidéo au repos", dossier: R + "assets/videos/personnages/", base, ext: EXT.video },
      { type: "video", libelle: "Vidéo « en train de parler » (facultative)", dossier: R + "assets/videos/personnages/", base: base + "-parle", ext: EXT.video, optionnel: true },
      { type: "image", libelle: "Image", dossier: R + "assets/images/personnages/", base, ext: EXT.perso }
    ]};
}
function imageSeule(dossier, base, titre, role, ext, tester){
  return { titre, role, tester: tester || [],
    groupes: [{ type: "image", libelle: "Image", dossier, base, ext }] };
}

/* ---------------- Définition des quatre jeux ---------------- */
async function construireDeclaration(){
  const R = "declaration/";
  const [dial, lec] = await Promise.all([json(R + "assets/data/dialogues.json"), json(R + "assets/data/lecons.json")]);
  const lien = (n, niv) => `${R}?salle=${n}&niveau=${niv}`;
  const deux = n => [{ libelle: "CM1", url: lien(n, "CM1") }, { libelle: "CM2", url: lien(n, "CM2") }];
  const salles = dial.salles;
  const persoSalles = p => salles.filter(s => s.dialogue_intro && s.dialogue_intro.perso === p)
                                 .map(s => ({ libelle: "Salle " + s.num, url: lien(s.num, "CM2") }));
  return {
    id: "declaration", nom: "Le Secret de la Déclaration", R,
    defaut: "Sans fichier : décor dessiné",
    tests: ["CM1", "CM2"].map(niv => ({ titre: niv, liens: [
      ...salles.map(s => ({ libelle: s.num + ". " + s.titre, url: lien(s.num, niv) })),
      { libelle: "🏁 Fin et quizz", url: lien(6, niv) }
    ]})),
    familles: [
      { titre: "Décors et cinématiques", slots: [
        decor(R, "intro", "Cinématique d'ouverture", "Plein écran au clic sur « Commencer ». Sautée si absente.", [{ libelle: "Accueil", url: R }]),
        ...salles.map(s => decor(R, "salle" + s.num, `Salle ${s.num} — ${s.titre}`,
          "Décor de fond de la salle" + (s.num === 1 ? ", et de l'écran d'accueil" : "") + ".", deux(s.num))),
        decor(R, "final", "Cinématique de fin", "Plein écran après la dernière énigme. Sautée si absente.", [{ libelle: "Salle 5", url: lien(5, "CM2") }])
      ]},
      { titre: "Personnages", slots: Object.entries(dial.personnages || {}).map(([cle, p]) =>
          personnage(R, cle, (p && p.nom) || cle, persoSalles(cle))) },
      { titre: "Documents des leçons (📚)", slots: listeLecons(lec)
          .filter(l => l.document && l.document.type === "image")
          .map(l => imageSeule(R + "assets/images/documents/", l.document.fichier || l.id, l.document.titre,
            `Leçon « ${l.titre} ». Format .jpg uniquement.`, EXT.jpg)) }
    ],
    docs: [
      { libelle: "📘 Guide du jeu (énigmes et solutions)", url: lienGitHub(R + "README.md") },
      { libelle: "🎞️ Liste des médias", url: lienGitHub(R + "assets/README.md") },
      { libelle: "📖 Guide pédagogique", url: lienGitHub(R + "GUIDE-PEDAGOGIQUE.md") },
      { libelle: "▶ Écran d'accueil du jeu", url: R }
    ]
  };
}

async function construireConstitution(){
  const R = "constitution/";
  const [dial, lec, enig] = await Promise.all([
    json(R + "assets/data/dialogues.json"),
    json(R + "assets/data/lecons.json"),
    json(R + "assets/data/enigmes.json")
  ]);
  const lien = (n, niv, e) => `${R}?salle=${n}&niveau=${niv}` + (e ? "&enigme=" + e : "");
  const deux = n => [{ libelle: "CM1", url: lien(n, "CM1") }, { libelle: "CM2", url: lien(n, "CM2") }];
  const salles = dial.salles;
  const persoSalles = p => salles.filter(s => s.dialogue_intro && s.dialogue_intro.perso === p)
                                 .map(s => ({ libelle: "Salle " + s.num, url: lien(s.num, "CM2") }));
  /* Énigmes du niveau demandé, dans l'ordre où le jeu les présente */
  const enigmesDe = (num, niv) => {
    const b = (enig.salles || []).find(x => x.num === num);
    return b ? (b.enigmes || []).filter(e => !e.niveaux || e.niveaux.includes(niv)) : [];
  };
  /* Illustrations facultatives déclarées dans enigmes.json */
  const illustrations = [];
  (enig.salles || []).forEach(b => (b.enigmes || []).forEach(e => {
    if(!e.media || !e.media.base) return;
    const niv = (!e.niveaux || e.niveaux.includes("CM1")) ? "CM1" : "CM2";
    const rang = enigmesDe(b.num, niv).findIndex(x => x.id === e.id) + 1;
    illustrations.push(imageSeule(R + "assets/images/cartes/", e.media.base,
      `Énigme ${e.id} — ${e.titre}`,
      (e.media.legende || "Illustration facultative") + ". Sans fichier, l'énigme reste jouable.",
      EXT.image, [{ libelle: "Salle " + b.num + " · " + niv, url: lien(b.num, niv, rang) }]));
  }));

  return {
    id: "constitution", nom: "Le Sceau de la République", R,
    defaut: "Sans fichier : décor dessiné",
    tests: ["CM1", "CM2"].map(niv => ({ titre: niv + " — " + salles.reduce((t,s)=>t+enigmesDe(s.num,niv).length,0) + " énigmes", liens: [
      ...salles.flatMap(s => [
        { libelle: s.num + ". " + s.titre, url: lien(s.num, niv) },
        ...enigmesDe(s.num, niv).map((e, i) => ({ libelle: "   ↳ " + e.id + " " + e.titre + " (" + e.type + ")", url: lien(s.num, niv, i + 1) }))
      ]),
      { libelle: "🏁 Fin, quizz et concours", url: lien(6, niv) }
    ]})),
    familles: [
      { titre: "Décors et cinématiques", slots: [
        decor(R, "intro", "Cinématique d'ouverture", "Plein écran au clic sur « Ouvrir le coffre ». Sautée si absente.", [{ libelle: "Accueil", url: R }]),
        ...salles.map(s => decor(R, "salle" + s.num, `Salle ${s.num} — ${s.titre}`,
          "Décor de fond de la salle" + (s.num === 1 ? ", et de l'écran d'accueil" : "") + ".", deux(s.num))),
        decor(R, "final", "Cinématique de fin", "Plein écran quand le coffre s'ouvre. Sautée si absente.", [{ libelle: "Salle 5", url: lien(5, "CM2") }])
      ]},
      { titre: "Personnages", slots: Object.entries(dial.personnages || {}).map(([cle, p]) =>
          personnage(R, cle, (p && p.nom) || cle, persoSalles(cle))) },
      { titre: "Illustrations d'énigmes (facultatives)", slots: illustrations },
      { titre: "Documents des leçons (📚)", slots: listeLecons(lec)
          .filter(l => l.document && l.document.type === "image")
          .map(l => imageSeule(R + "assets/images/documents/", l.document.fichier || l.id, l.document.titre,
            `Leçon « ${l.titre} ». Format .jpg uniquement.`, EXT.jpg)) }
    ],
    docs: [
      { libelle: "📘 Guide du jeu (énigmes et solutions)", url: lienGitHub(R + "README.md") },
      { libelle: "🎞️ Liste des médias", url: lienGitHub(R + "assets/README.md") },
      { libelle: "📖 Guide pédagogique", url: lienGitHub(R + "GUIDE-PEDAGOGIQUE.md") },
      { libelle: "🏛️ Fiche concours", url: lienGitHub(R + "assets/data/concours.json") },
      { libelle: "▶ Écran d'accueil du jeu", url: R }
    ]
  };
}

async function construireTour(){
  const R = "tour-du-monde/";
  const [dial, lec] = await Promise.all([json(R + "assets/data/dialogues.json"), json(R + "assets/data/lecons.json")]);
  const lien = (n, niv) => `${R}?salle=${n}&niveau=${niv}`;
  const deux = n => [{ libelle: "CM1", url: lien(n, "CM1") }, { libelle: "CM2", url: lien(n, "CM2") }];
  const salles = dial.salles;
  const persoSalles = p => salles.filter(s => s.dialogue_intro && s.dialogue_intro.perso === p)
                                 .map(s => ({ libelle: "Escale " + s.num, url: lien(s.num, "CM2") }));

  /* Cartes : celles des énigmes, puis celles des leçons (même dossier) */
  const cartes = new Map();
  const carte = (base, titre, role, ext, tester) => {
    const s = cartes.get(base);
    if(s){ s.role += " Aussi : " + role; return; }
    cartes.set(base, imageSeule(R + "assets/images/cartes/", base, titre, role, ext, tester));
  };
  carte("planisphere", "Fond du planisphère", "Escale 1 : placé sous les zones cliquables.", EXT.image, deux(1));
  [["desert", "désert"], ["jungle", "jungle"], ["montagne", "Himalaya"], ["campagne", "campagne anglaise"],
   ["banquise", "banquise (CM2)"], ["savane", "savane (CM2)"]].forEach(([b, nom]) =>
    carte("paysage-" + b, "Paysage : " + nom, "Escale 3 : vignette du paysage.", EXT.image, [{ libelle: "Escale 3", url: lien(3, "CM2") }]));
  const lecons = listeLecons(lec);
  lecons.filter(l => l.carte && l.carte.base).forEach(l =>
    carte(l.carte.base, l.carte.legende || l.carte.base, `leçon « ${l.titre} » (📚), lue en .jpg uniquement.`, EXT.jpg));

  const familles = [
    { titre: "Décors et cinématiques", slots: [
      decor(R, "intro", "Cinématique d'ouverture — le pari", "Plein écran au clic sur « Lever l'ancre ». Sautée si absente.", [{ libelle: "Accueil", url: R }]),
      ...salles.map(s => decor(R, "etape" + s.num, `Escale ${s.num} — ${s.titre}`,
        "Décor de fond de l'escale" + (s.num === 1 ? ", et de l'écran d'accueil" : "") + ".", deux(s.num))),
      decor(R, "final", "Cinématique de fin — le jour gagné", "Plein écran après l'escale 5. Sautée si absente.", [{ libelle: "Escale 5", url: lien(5, "CM2") }])
    ]},
    { titre: "Personnages", slots: Object.entries(dial.personnages || {}).map(([cle, p]) =>
        personnage(R, cle, (p && p.nom) || cle, persoSalles(cle))) },
    { titre: "Cartes et paysages", slots: [...cartes.values()] }
  ];
  const docs = lecons.filter(l => l.document && l.document.type === "image");
  if(docs.length) familles.push({ titre: "Documents des leçons (📚)", slots: docs.map(l =>
    imageSeule(R + "assets/images/documents/", l.document.fichier || l.id, l.document.titre,
      `Leçon « ${l.titre} ». Format .jpg uniquement.`, EXT.jpg)) });
  const videos = lecons.filter(l => l.video && l.video.base);
  if(videos.length) familles.push({ titre: "Vidéos des leçons (📚)", slots: videos.map(l => ({
    titre: l.video.titre || l.titre, role: `Leçon « ${l.titre} ». Format .mp4 uniquement.`, tester: [],
    groupes: [{ type: "video", libelle: "Vidéo", dossier: R + "assets/videos/", base: l.video.base, ext: EXT.mp4 }] })) });

  return {
    id: "tour-du-monde", nom: "Le Tour du Monde en 80 minutes", R,
    defaut: "Sans fichier : décor dessiné",
    tests: ["CM1", "CM2"].map(niv => ({ titre: niv, liens: [
      ...salles.map(s => ({ libelle: s.num + ". " + s.titre, url: lien(s.num, niv) })),
      { libelle: "🏁 Fin et quizz", url: lien(6, niv) }
    ]})),
    familles,
    docs: [
      { libelle: "📘 Guide du jeu (énigmes et solutions)", url: lienGitHub(R + "README.md") },
      { libelle: "🎞️ Liste des médias", url: lienGitHub(R + "assets/README.md") },
      { libelle: "▶ Écran d'accueil du jeu", url: R }
    ]
  };
}

async function construireMission(){
  const M = window.MISSION;
  if(!M || !M.sessions || !M.sessions.length) throw new Error("données mission-geo/js/donnees/ introuvables");
  const R = "mission-geo/";
  const parBase = new Map();
  const ajouter = (famille, m, usage, test) => {
    if(!m || !m.base) return;
    let s = parBase.get(m.base);
    if(!s){
      s = { titre: m.legende || m.alt || usage, role: "", usages: [], tester: [], groupes: [
        { type: "video", libelle: "Vidéo", dossier: R + "assets/videos/", base: m.base, ext: EXT.mgVideo },
        { type: "image", libelle: "Image", dossier: R + "assets/images/", base: m.base, ext: EXT.mgImage }
      ]};
      parBase.set(m.base, s);
      famille.slots.push(s);
    }
    s.usages.push(usage);
    s.role = s.usages.join(" · ");
    if(test && !s.tester.some(t => t.url === test.url)) s.tester.push(test);
  };

  const finale = { libelle: "Piste finale", url: R + "?seance=final" };
  const communs = { titre: "Emplacements communs", slots: [] };
  ajouter(communs, { base: "mission-intro", legende: "Ouverture de la mission" }, "Écran d'accueil", { libelle: "Accueil", url: R });
  ajouter(communs, { base: "final-intro", legende: "Aéroport d'Ajaccio" }, "Piste finale : introduction", finale);
  ajouter(communs, { base: "carte-corse", legende: "Carte quadrillée de la Corse" }, "Piste finale : fond de carte (remplace le dessin)", finale);
  ajouter(communs, { base: "recompense", legende: "Récompense mystère" }, "Fin de mission (nom réglable dans ⚙️ → Récompense mystère)", null);
  const familles = [communs];

  M.ordre().forEach(s => {
    const f = { titre: `Séance ${s.numero} — ${s.titre}`, slots: [] };
    const test = { libelle: "Séance " + s.numero, url: R + "?seance=" + s.numero };
    ajouter(f, s.intro && s.intro.media, "Introduction", test);
    ajouter(f, s.mediaCoeur, "Décor du cœur de séance", test);
    (s.activites || []).forEach((a, i) => {
      ajouter(f, a.media, `Illustration de l'énigme ${i + 1} (${a.type})`, test);
      ajouter(f, a.fond, `Fond de carte de l'énigme ${i + 1} (remplace le dessin, les zones restent en place)`, test);
    });
    ajouter(f, s.fin && s.fin.media, "Dénouement", test);
    const l = M.lecons[s.lecon];
    ajouter(f, l && l.media, "Illustration de la leçon", test);
    if(f.slots.length) familles.push(f);
  });

  return {
    id: "mission-geo", nom: "Mission géographique — Année A", R,
    defaut: "Sans fichier : dessin intégré, ou emplacement masqué",
    tests: [
      { titre: "Séances", liens: M.ordre().map(s => ({ libelle: s.numero + ". " + s.titre, url: R + "?seance=" + s.numero })) },
      { titre: "Fin", liens: [{ libelle: "🧳 Piste finale", url: R + "?seance=final" }] }
    ],
    familles,
    docs: [
      { libelle: "📘 Guide du jeu (séances et solutions)", url: lienGitHub(R + "README.md") },
      { libelle: "🎞️ Liste des médias", url: lienGitHub(R + "assets/README.md") },
      { libelle: "▶ Écran d'accueil du jeu", url: R }
    ]
  };
}

const CONSTRUCTEURS = {
  "declaration": construireDeclaration,
  "tour-du-monde": construireTour,
  "mission-geo": construireMission,
  "constitution": construireConstitution
};

/* ---------------- Quels fichiers existent ? ----------------
   1. serveur local (lancer.bat)  : /api/fichiers liste tout d'un coup ;
   2. site en ligne (GitHub Pages): l'API GitHub liste le dépôt ;
   3. sinon : on essaie chaque nom possible (requêtes HEAD). */
async function lireInventaire(){
  if(EN_FICHIER) return { source: "fichier", fichiers: null };
  try{
    const r = await fetch("/api/fichiers", { cache: "no-store" });
    if(r.ok){
      const j = await r.json();
      if(j && j.fichiers) return { source: "local", fichiers: new Map(Object.entries(j.fichiers)) };
    }
  }catch(e){}
  if(EN_LIGNE){
    try{
      const r = await fetch(`https://api.github.com/repos/${DEPOT.owner}/${DEPOT.repo}/git/trees/${DEPOT.branche}?recursive=1`, { cache: "no-store" });
      if(r.ok){
        const j = await r.json();
        const m = new Map();
        (j.tree || []).forEach(t => { if(t.type === "blob" && t.path.includes("/assets/")) m.set(t.path, t.size); });
        return { source: "github", fichiers: m };
      }
    }catch(e){}
  }
  return { source: "sonde", fichiers: null };
}

const sondes = new Map();
function sonder(chemin){
  if(!sondes.has(chemin)){
    sondes.set(chemin, fetch(enc(chemin), { method: "HEAD", cache: "no-store" })
      .then(r => r.ok ? (Number(r.headers.get("Content-Length")) || 0) : null)
      .catch(() => null));
  }
  return sondes.get(chemin);
}

async function resoudreGroupe(g){
  const chemins = g.ext.map(e => g.dossier + g.base + e);
  if(INVENTAIRE.fichiers){
    const c = chemins.find(x => INVENTAIRE.fichiers.has(x));
    return c ? { chemin: c, taille: INVENTAIRE.fichiers.get(c) } : null;
  }
  if(INVENTAIRE.source === "fichier") return null;
  const tailles = await Promise.all(chemins.map(sonder));
  const i = tailles.findIndex(t => t !== null);
  return i < 0 ? null : { chemin: chemins[i], taille: tailles[i] };
}

async function resoudreJeu(jeu){
  const slots = jeu.familles.flatMap(f => f.slots);
  await Promise.all(slots.map(async s => {
    s.res = await Promise.all(s.groupes.map(async g => ({ g, trouve: await resoudreGroupe(g) })));
    const principal = s.res.find(r => r.trouve && !r.g.optionnel);
    s.etat = principal ? principal.g.type : "absent";
    s.lourd = s.res.some(r => r.trouve && r.trouve.taille > SEUIL[r.g.type]);
  }));
  jeu.orphelins = chercherOrphelins(jeu, slots);
}

/* Fichiers présents dans <jeu>/assets/ mais qu'aucun emplacement n'attend */
function chercherOrphelins(jeu, slots){
  if(!INVENTAIRE.fichiers) return null;
  const attendus = new Map();
  const noter = c => attendus.set(c.toLowerCase(), c);
  slots.forEach(s => s.groupes.forEach(g => {
    g.ext.forEach(e => noter(g.dossier + g.base + e));
    if(g.type === "video") noter(g.dossier + g.base + ".vtt");   // sous-titres
  }));
  const liste = [];
  for(const [chemin, taille] of INVENTAIRE.fichiers){
    if(!chemin.startsWith(jeu.R + "assets/") || chemin.startsWith(jeu.R + "assets/data/")) continue;
    if(/\/README\.md$/i.test(chemin)) continue;
    const exact = attendus.get(chemin.toLowerCase());
    if(exact !== chemin) liste.push({ chemin, taille, suggestion: exact || null });
  }
  return liste;
}

/* ---------------- Affichage ---------------- */
function afficherSource(){
  const el = document.getElementById("source");
  el.innerHTML = {
    local:   "📁 <b>Version locale</b> : fichiers du dossier de l'ordinateur. Un fichier déposé apparaît dès que vous revenez sur cette page (ou 🔄). Publiez ensuite sur GitHub.",
    github:  "🌐 <b>Version en ligne</b> : contenu du dépôt GitHub. Après un envoi, la liste se met à jour tout de suite ; l'aperçu peut demander une minute.",
    sonde:   "🔎 Détection fichier par fichier (serveur sans inventaire) : les fichiers mal nommés ne peuvent pas être signalés.",
    fichier: "⚠️ Page ouverte en double-clic : le navigateur bloque la lecture des dossiers."
  }[INVENTAIRE.source] || "Recherche des fichiers…";
}

function rendreOnglets(){
  document.getElementById("onglets").innerHTML = ONGLETS.map(o => {
    const j = JEUX[o.id];
    const slots = j && j.familles ? j.familles.flatMap(f => f.slots) : [];
    const n = slots.filter(s => s.etat && s.etat !== "absent").length;
    return `<button role="tab" data-onglet="${o.id}" aria-selected="${o.id === actif}">${esc(o.titre)}` +
      (slots.length ? ` <small>${n}/${slots.length}</small>` : "") + `</button>`;
  }).join("");
}

function carteMedia(s, jeu){
  const video = s.res.find(r => r.trouve && r.g.type === "video" && !r.g.optionnel);
  const image = s.res.find(r => r.trouve && r.g.type === "image");
  const q = "?t=" + JETON;
  let apercu;
  if(video){
    apercu = `<video src="${enc(video.trouve.chemin)}${q}#t=0.5" ${image ? `poster="${enc(image.trouve.chemin)}${q}"` : ""}
      muted controls preload="metadata" playsinline onerror="this.parentNode.classList.add('attente')"></video>`;
  }else if(image){
    apercu = `<a href="${enc(image.trouve.chemin)}${q}" target="_blank" rel="noopener" title="Ouvrir en grand">
      <img src="${enc(image.trouve.chemin)}${q}" alt="" loading="lazy" onerror="this.closest('.apercu').classList.add('attente')"></a>`;
  }else{
    apercu = `<div class="vide"><span>✏️</span>${esc(jeu.defaut)}</div>`;
  }

  const court = c => c.slice(jeu.R.length);
  const lignes = s.res.map(({ g, trouve }) => {
    const icone = g.type === "video" ? "🎬" : "🖼️";
    if(trouve){
      const lourd = trouve.taille > SEUIL[g.type];
      return `<li class="ok">✔ ${icone} ${esc(g.libelle)} : <code>${esc(court(trouve.chemin))}</code>` +
        (trouve.taille ? ` · ${mo(trouve.taille)}` : "") +
        (lourd ? ` <span class="lourd">⚠️ lourd</span>` : "") + `</li>`;
    }
    const autres = g.ext.length > 1 ? ` <small>(ou ${esc(g.ext.slice(1).join(", "))})</small>` : "";
    return `<li class="manque">– ${icone} ${esc(g.libelle)} : <code>${esc(court(g.dossier + g.base + g.ext[0]))}</code>${autres}</li>`;
  }).join("");

  const tests = (s.tester || []).map(t =>
    `<a class="bouton" href="${esc(t.url)}" target="_blank" rel="noopener" title="Voir dans le jeu">▶ ${esc(t.libelle)}</a>`).join("");
  const dossiers = new Map();
  s.groupes.filter(g => !g.optionnel).forEach(g => { if(!dossiers.has(g.dossier)) dossiers.set(g.dossier, g.type); });
  const depots = [...dossiers].map(([d, type]) =>
    `<a class="bouton" href="${lienUpload(d)}" target="_blank" rel="noopener" title="Ouvre ${esc(d)} sur GitHub : glissez-y le fichier, nommé comme indiqué">⬆️ ${type === "video" ? "Vidéo" : "Image"} → GitHub</a>`).join("");
  const nom = s.groupes[0].base;
  const etat = { video: "🎬 vidéo", image: "🖼️ image", absent: "✏️ par défaut" }[s.etat];

  return `<article class="media etat-${s.etat}">
    <div class="apercu">${apercu}</div>
    <div class="corps">
      <div class="entete"><h4>${esc(s.titre)}</h4><span class="etat">${etat}</span></div>
      <p class="role">${esc(s.role)}</p>
      <ul>${lignes}</ul>
      <div class="actions">${tests}
        <button class="bouton" type="button" data-copier="${esc(nom)}" title="Copier le nom à donner au fichier (sans l'extension)">📋 ${esc(nom)}</button>
        ${depots}</div>
    </div>
  </article>`;
}

function garder(s){
  if(filtre === "presents") return s.etat !== "absent";
  if(filtre === "manquants") return s.etat === "absent";
  if(filtre === "lourds") return s.lourd;
  return true;
}

function rendre(){
  rendreOnglets();
  const zone = document.getElementById("contenu");
  if(INVENTAIRE.source === "fichier"){
    zone.innerHTML = `<div class="message erreur">Cette page a été ouverte en double-clic : le navigateur l'empêche de lire les dossiers du projet.<br>
      Lancez <b>lancer.bat</b> (Windows) ou <b>lancer-mac.command</b> (Mac), puis ouvrez
      <b>http://127.0.0.1:8000/verifier.html</b> — ou utilisez la
      <a href="https://idgir.github.io/escape-games-cm1-cm2/verifier.html">version en ligne</a>.</div>`;
    return;
  }
  const jeu = JEUX[actif];
  if(!jeu){ zone.innerHTML = `<div class="message">Chargement…</div>`; return; }
  if(jeu.erreur){ zone.innerHTML = `<div class="message erreur">${esc(jeu.erreur)}</div>`; return; }

  const slots = jeu.familles.flatMap(f => f.slots);
  const nb = e => slots.filter(s => s.etat === e).length;
  const nbLourds = slots.filter(s => s.lourd).length;

  const tests = jeu.tests.map(r => `<div class="rangee"><b>${esc(r.titre)}</b>` +
    r.liens.map(l => `<a class="bouton" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.libelle)}</a>`).join("") +
    `</div>`).join("");

  const familles = jeu.familles.map(f => {
    const visibles = f.slots.filter(garder);
    if(!visibles.length) return "";
    return `<h3 class="famille">${esc(f.titre)}</h3><div class="grille">${visibles.map(s => carteMedia(s, jeu)).join("")}</div>`;
  }).join("") || `<p class="aide">Aucun emplacement ne correspond à ce filtre.</p>`;

  let orphelins;
  if(jeu.orphelins === null){
    orphelins = `<p class="aide">Disponible avec lancer.bat ou sur le site en ligne.</p>`;
  }else if(!jeu.orphelins.length){
    orphelins = `<p class="aide">✅ Aucun fichier mal nommé : chaque fichier des dossiers médias est bien utilisé par le jeu.</p>`;
  }else{
    orphelins = `<ul class="orphelins">` + jeu.orphelins.map(o => `<li><code>${esc(o.chemin)}</code> (${mo(o.taille || 0)}) — ` +
      (o.suggestion ? `presque bon : à renommer exactement <code>${esc(o.suggestion.split("/").pop())}</code> (majuscules/minuscules).`
                    : `nom ou dossier non reconnu : le jeu ne l'affichera pas. Renommez-le d'après les cartes ci-dessus.`) +
      `</li>`).join("") + `</ul>`;
  }

  zone.innerHTML = `
    <section class="bloc">
      <h2>🧩 Tester les énigmes</h2>
      <p class="aide">Ouvre le jeu directement à l'endroit choisi, dans un nouvel onglet. <b>Rien n'est sauvegardé</b> :
        la partie des élèves sur ce poste reste intacte.</p>
      ${tests}
    </section>

    <section class="bloc">
      <h2>🎞️ Médias</h2>
      <p class="aide">Pour <b>ajouter ou remplacer</b> un média : déposez un fichier portant <b>exactement le nom indiqué</b>
        (📋 le copie) dans le dossier indiqué. Un fichier du même nom remplace l'ancien. Rien à modifier dans le code.</p>
      <div class="resume">
        <span class="pastille">${slots.length} emplacements</span>
        <span class="pastille video">🎬 ${nb("video")} vidéo</span>
        <span class="pastille image">🖼️ ${nb("image")} image</span>
        <span class="pastille">✏️ ${nb("absent")} par défaut</span>
        ${nbLourds ? `<span class="pastille alerte">⚠️ ${nbLourds} lourd${nbLourds > 1 ? "s" : ""}</span>` : ""}
        <div class="filtres" role="group" aria-label="Filtrer">
          ${[["tous", "Tout"], ["presents", "Présents"], ["manquants", "Manquants"], ["lourds", "Lourds"]].map(([v, t]) =>
            `<button type="button" data-filtre="${v}" aria-pressed="${filtre === v}">${t}</button>`).join("")}
        </div>
      </div>
      ${familles}
    </section>

    <section class="bloc">
      <h2>🧹 Fichiers mal nommés</h2>
      ${orphelins}
    </section>

    <section class="bloc">
      <h2>📚 Documents</h2>
      <div class="liste-docs">${jeu.docs.map(d =>
        `<a class="bouton" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.libelle)}</a>`).join("")}</div>
    </section>`;
}

/* ---------------- Chargement ---------------- */
let chargementEnCours = false;
async function charger(){
  if(chargementEnCours) return;
  chargementEnCours = true;
  JETON = Date.now();
  sondes.clear();
  INVENTAIRE = await lireInventaire();
  afficherSource();
  await Promise.all(Object.entries(CONSTRUCTEURS).map(async ([id, construire]) => {
    try{
      const jeu = await construire();
      await resoudreJeu(jeu);
      JEUX[id] = jeu;
    }catch(e){
      JEUX[id] = { erreur: "Impossible de lire les données du jeu : " + e.message };
    }
    if(id === actif) rendre(); else rendreOnglets();
  }));
  chargementEnCours = false;
}

document.addEventListener("click", e => {
  const onglet = e.target.closest("[data-onglet]");
  if(onglet){ actif = onglet.dataset.onglet; history.replaceState(null, "", "#" + actif); rendre(); return; }
  const f = e.target.closest("[data-filtre]");
  if(f){ filtre = f.dataset.filtre; rendre(); return; }
  const c = e.target.closest("[data-copier]");
  if(c){
    const nom = c.dataset.copier;
    (navigator.clipboard ? navigator.clipboard.writeText(nom) : Promise.reject())
      .then(() => { c.textContent = "✓ copié"; setTimeout(() => { c.textContent = "📋 " + nom; }, 1200); })
      .catch(() => prompt("Nom à donner au fichier :", nom));
  }
});
document.getElementById("btn-actualiser").addEventListener("click", charger);
/* En local, revenir sur la page (après avoir déposé un fichier dans le dossier)
   suffit à relire les dossiers. En ligne, on s'en tient au bouton 🔄 pour
   ménager l'API GitHub. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && INVENTAIRE.source === "local") charger();
});

rendreOnglets();
charger();
</script>
