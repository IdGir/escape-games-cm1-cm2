<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche de séquence — Escape games CM1 · CM2</title>
<!--
  FICHE DE SÉQUENCE « AVANT / APRÈS » (amélioration N18)
  Adresse : sequences/fiche.html?jeu=melanges
  Une fiche : objectif · activité AVANT (15-20 min) · LE JEU · activité APRÈS (15-20 min) · évaluer ·
  lien avec la fiche de compétences par période (C5) et le passeport (C3). Imprimable (A4).
  Les fiches sont dans donnees.js ; un jeu sans fiche affiche le modèle vierge (sans bloquer le jeu).
-->
<style>
  :root{--fond:#f6f4ef;--papier:#fff;--encre:#1f2430;--doux:#5d6472;--ligne:#e2ddd2;--accent:#1d3a8a;--avant:#b45309;--jeu:#15803d;--apres:#6d28d9}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--encre)}
  header,main,footer{max-width:1100px;margin:0 auto;padding:0 20px}
  header{padding-top:18px} h1{margin:6px 0 2px;font-size:1.55rem} .sous{color:var(--doux);margin:0}
  .noprint a{color:var(--accent)}
  .bloc{background:var(--papier);border:1px solid var(--ligne);border-radius:12px;padding:14px 18px;margin:14px 0}
  .bloc h2{margin:0 0 6px;font-size:1.08rem}
  .objectif{border-left:6px solid var(--accent)}
  .trois{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
  .temps{background:var(--papier);border:1px solid var(--ligne);border-top-width:6px;border-radius:12px;padding:12px 16px}
  .temps.avant{border-top-color:var(--avant)} .temps.jeu{border-top-color:var(--jeu)} .temps.apres{border-top-color:var(--apres)}
  .temps h2{margin:0;font-size:1rem} .temps .duree{display:inline-block;margin:2px 0 6px;padding:1px 10px;border-radius:999px;background:#f0eee9;font-size:.8rem;font-weight:600}
  .temps h3{margin:8px 0 2px;font-size:.88rem;text-transform:uppercase;letter-spacing:.03em;color:var(--doux)}
  .temps ol,.temps ul,.bloc ul{margin:4px 0 4px 1.2em;padding:0} .temps li,.bloc li{margin:3px 0}
  .trace{background:#f7f5ff;border-radius:8px;padding:6px 10px;margin-top:8px;font-size:.92rem}
  .liens{display:flex;flex-wrap:wrap;gap:8px 14px;margin:6px 0}
  .liens a{display:inline-block;padding:3px 12px;border:1px solid var(--ligne);border-radius:999px;text-decoration:none;color:var(--accent);background:#fff;font-size:.9rem}
  .modele-vide{border:2px dashed var(--ligne);padding:10px 14px;border-radius:10px;color:var(--doux)}
  .modele-vide .ligne{border-bottom:1px solid var(--ligne);height:1.7em;margin:2px 0}
  button{font:inherit;padding:6px 14px;border-radius:9px;border:1px solid var(--ligne);background:#fff;cursor:pointer}
  footer{padding-bottom:30px;color:var(--doux);font-size:.85rem}
  @media (max-width:820px){.trois{grid-template-columns:1fr}}
  @media print{
    body{background:#fff;font-size:10pt} .noprint{display:none!important}
    .bloc,.temps{break-inside:avoid;border-color:#bbb} .trois{gap:8px} header,main,footer{max-width:none;padding:0}
    @page{size:A4 portrait;margin:10mm}
  }
</style>
</head>
<body>
<header class="noprint">
  <p><a href="../index.html">← Accueil des jeux</a> · <a href="index.html">📘 Toutes les séquences</a> · <a href="../annee.html">📅 L'année</a></p>
</header>
<header>
  <h1 id="titre">Fiche de séquence</h1>
  <p class="sous" id="sous-titre"></p>
</header>
<main id="fiche"></main>
<footer class="noprint"><button id="btn-imprimer" type="button">🖨️ Imprimer la fiche</button></footer>

<script src="../commun/donnees/catalogue.js?c3"></script>
<script src="donnees.js?c1"></script>
<script>
"use strict";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const jeuId = new URLSearchParams(location.search).get("jeu") || "";
const J = CATALOGUE.jeux.find(j => j.dossier === jeuId || j.id === jeuId) || null;
const S = (J && SEQUENCES[J.dossier || J.id]) || (SEQUENCES[jeuId] || null);
const liste = (l, tag) => l && l.length ? `<${tag || "ul"}>${l.map(x => `<li>${esc(x)}</li>`).join("")}</${tag || "ul"}>` : "";
const lignes = n => Array.from({ length: n }, () => '<div class="ligne"></div>').join("");

function temps(cls, icone, titre, t){
  return `<section class="temps ${cls}"><h2>${icone} ${titre}</h2><span class="duree">${esc(t.duree || "")}</span>
    ${t.titre ? `<p><b>${esc(t.titre)}</b></p>` : ""}${t.modalite ? `<p>${esc(t.modalite)}</p>` : ""}
    ${t.deroule ? `<h3>Déroulé</h3>${liste(t.deroule, "ol")}` : ""}
    ${t.materiel ? `<h3>Matériel</h3>${liste(t.materiel)}` : ""}
    ${t.trace ? `<div class="trace"><b>Trace :</b> ${esc(t.trace)}</div>` : ""}</section>`;
}
function vierge(){
  return `<section class="bloc objectif"><h2>🎯 Objectif de la séquence</h2><div class="modele-vide">${lignes(2)}</div></section>
  <div class="trois">
    <section class="temps avant"><h2>🔎 Avant le jeu</h2><span class="duree">15-20 min</span><h3>Mise en situation</h3><div class="modele-vide">${lignes(5)}</div><h3>Matériel</h3><div class="modele-vide">${lignes(2)}</div></section>
    <section class="temps jeu"><h2>🎮 Le jeu</h2><span class="duree">45-75 min</span><h3>Formule retenue, rôles, consignes</h3><div class="modele-vide">${lignes(7)}</div></section>
    <section class="temps apres"><h2>🧩 Après le jeu</h2><span class="duree">15-20 min</span><h3>Réinvestissement</h3><div class="modele-vide">${lignes(5)}</div><h3>Trace écrite</h3><div class="modele-vide">${lignes(2)}</div></section>
  </div>`;
}
function rendre(){
  const titre = J ? `${J.icone || ""} ${J.titre}` : "Fiche de séquence";
  document.getElementById("titre").textContent = "Séquence — " + titre;
  document.title = "Séquence — " + (J ? J.titre : "modèle") + " — Escape games CM1 · CM2";
  const per = J && J.periodes && J.periodes.length ? J.periodes[0] : "";
  document.getElementById("sous-titre").textContent = J ? `${J.matiere} · ${J.annee && /^[AB]$/.test(J.annee) ? "Année " + J.annee + " · " : ""}${per ? "période " + per + " (" + CATALOGUE.periodes[per] + ") · " : ""}${S && S.niveaux ? S.niveaux : "CM1 · CM2"}` : "Modèle vierge à compléter";
  const m = document.getElementById("fiche");
  if(!S){
    m.innerHTML = `<section class="bloc noprint"><h2>Pas encore de fiche de séquence pour ce jeu</h2>
      <p>${J ? `Le jeu <b>${esc(J.titre)}</b> se joue très bien sans : la fiche s'ajoutera progressivement.` : "Jeu inconnu : voir la liste des séquences."} Voici le <b>modèle</b> (objectif · avant · le jeu · après), à remplir à la main ou à rédiger dans <code>sequences/donnees.js</code> (mode d'emploi dans <code>sequences/README.md</code>).</p>
      <div class="liens">${J && J.dossier ? `<a href="../${esc(J.dossier)}/">▶ Jouer</a><a href="https://github.com/IdGir/escape-games-cm1-cm2/tree/escape-games/${esc(J.dossier)}#readme" target="_blank" rel="noopener">📘 Guide pédagogique du jeu</a>` : ""}<a href="index.html">📘 Toutes les séquences</a></div></section>` + vierge()
      + (J ? `<section class="bloc"><h2>📚 Compétences visées par le jeu</h2><p>${esc(J.competences || "")}</p></section>` : "");
    return;
  }
  const dossier = J.dossier;
  m.innerHTML = `<section class="bloc objectif"><h2>🎯 Objectif de la séquence</h2><p>${esc(S.objectif)}</p>
      <p class="sous"><b>Compétences du jeu :</b> ${esc(J.competences || "")}</p></section>
    <div class="trois">${temps("avant", "🔎", "Avant le jeu", S.avant)}
      <section class="temps jeu"><h2>🎮 Le jeu</h2><span class="duree">${esc(S.jeu.duree || "")}</span>
        <h3>Formule</h3>${liste(S.jeu.formules)}<h3>Rôles dans l'équipe</h3>${liste(S.jeu.roles)}<h3>Conseils</h3>${liste(S.jeu.conseils)}
        ${dossier ? `<div class="liens noprint" style="margin-top:8px"><a href="../${esc(dossier)}/">▶ Jouer</a><a href="../${esc(dossier)}/prof.html">👨‍🏫 Tableau de bord</a></div>` : ""}</section>
      ${temps("apres", "🧩", "Après le jeu", S.apres)}</div>
    <section class="bloc"><h2>✅ Évaluer et garder une trace</h2>${liste(S.evaluer)}</section>
    ${S.prolonger && S.prolonger.length ? `<section class="bloc"><h2>🚀 Pour aller plus loin (facultatif)</h2>${liste(S.prolonger)}</section>` : ""}
    <section class="bloc"><h2>🔗 Lien avec la fiche de compétences</h2>
      <p>Ce que cette séquence travaille est repris, avec les autres jeux de la période, dans la <b>fiche de compétences</b> à imprimer (communication aux familles, à la direction, à l'inspection) et dans le <b>passeport de compétences</b> de chaque élève.</p>
      <div class="liens noprint"><a href="../periode.html?p=${esc(per || "P1")}&annee=${esc(/^[AB]$/.test(J.annee) ? J.annee : "A")}">🖨️ Fiche de compétences de la période ${esc(per)} (C5)</a><a href="../passeport.html">🎓 Passeport de compétences (C3)</a><a href="../resultats.html">📊 Bilan de classe</a>
        ${dossier ? `<a href="../${esc(dossier)}/lecons-imprimables.html">📖 Leçons à imprimer</a><a href="https://github.com/IdGir/escape-games-cm1-cm2/tree/escape-games/${esc(dossier)}#readme" target="_blank" rel="noopener">📘 Guide pédagogique du jeu</a>` : ""}</div></section>`;
}
document.getElementById("btn-imprimer").addEventListener("click", () => window.print());
rendre();
window.SEQUENCE_PAGE = { jeuId, J, S, rendre };
</script>
</body>
</html>
